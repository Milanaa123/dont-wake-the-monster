name: Build original 3D art library
on:
  push:
    paths:
      - "scripts/generate_reference_glb.py"
      - "scripts/creature_shapes_v2.py"
      - "scripts/crop_shapes_v2.py"
      - "scripts/world_shapes_v2.py"
      - ".github/workflows/art-library.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  art-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate game-ready 3D GLB packs
        run: |
          python3 -m py_compile scripts/generate_reference_glb.py
          python3 scripts/generate_reference_glb.py
          python3 - <<'PY'
          import json, struct, pathlib
          root = pathlib.Path("dist/visual-library")
          doc = json.loads((root / "manifest.json").read_text())
          assert len(doc["pets"]) == 30
          assert len(doc["crops"]) == 90
          assert len(doc["environment"]) == 8
          for pack in doc["packs"]:
              data = (root / pack["file"]).read_bytes()
              magic, version, total = struct.unpack_from("<4sII", data)
              assert magic == b"glTF" and version == 2 and total == len(data)
              jsonlen, tag = struct.unpack_from("<I4s", data, 12)
              assert tag == b"JSON"
              scene = json.loads(data[20:20 + jsonlen].decode("utf-8"))
              assert len(scene["meshes"]) == pack["meshes"]
              assert len(scene["images"]) == 1 and len(scene["textures"]) == 1
              assert all(len(m["primitives"]) == 1 for m in scene["meshes"])
              assert all("TEXCOORD_0" in m["primitives"][0]["attributes"] for m in scene["meshes"])
              assert all(a["count"] > 0 for a in scene["accessors"])
          print("PASS: 128 textured 3D meshes, one primitive per Roblox asset")
          PY
          cp docs/ROBLOX_3D_ASSET_IMPORT.md dist/visual-library/INSTALL_IN_ROBLOX.md
      - name: Upload original art library for Roblox Studio Importer
        uses: actions/upload-artifact@v4
        with:
          name: dwtm-original-3d-art
          path: dist/visual-library/
          if-no-files-found: error
          retention-days: 14
