name: Build Roblox place

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate project structure and free-coin economy
        run: |
          python3 scripts/validate_project.py
          python3 scripts/test_storybook_art.py
          python3 -m py_compile scripts/validate_project.py scripts/publish_roblox.py
          python3 -m py_compile scripts/storybook_family_sculpts.py scripts/storybook_crop_blooms.py scripts/pet_detail_sculpts.py

      - name: Install Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip' \
            -o /tmp/rojo.zip
          mkdir -p /tmp/rojo
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          /tmp/rojo/rojo --version

      - name: Install Luau compiler and check script syntax
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' \
            -o /tmp/luau.zip
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            /tmp/luau/luau-compile "$script" > /dev/null
          done < <(find src -name '*.luau' -print0)

      - name: Execute gardening rules in Luau runtime
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/luau/luau
          python3 scripts/test_garden.py /tmp/luau/luau

      - name: Execute individuality and pet-bond tests in Luau runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_personality.py /tmp/luau/luau

      - name: Execute cat purring and long-petting rules in Luau
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_affection.py /tmp/luau/luau

      - name: Test traveling merchant rotation and safe purchases
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_merchant.py /tmp/luau/luau

      - name: Test persistence failures and overlapping saves
        shell: bash
        run: python3 scripts/test_persistence.py /tmp/luau/luau

      - name: Rebuild native 3D mesh library from authoritative sculpt sources
        run: |
          set -euo pipefail
          python3 scripts/bake_orchard.py
          python3 scripts/verify_runtime_geometry.py
          test -s assets/OrchardGeometry.model.json

      - name: Build playable-place file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          /tmp/rojo/rojo build default.project.json --output dist/dont-wake-the-monster.rbxlx
          test -s dist/dont-wake-the-monster.rbxlx

      - name: Upload built place
        uses: actions/upload-artifact@v4
        with:
          name: roblox-place
          path: dist/dont-wake-the-monster.rbxlx
          if-no-files-found: error
          retention-days: 14

      - name: Build and verify the local Studio kit
        shell: bash
        run: |
          set -euo pipefail
          # The bake ran BEFORE Rojo, so both Place and Studio kit contain
          # the same newest authored meshes. Binary JSON is generated output.
          python3 scripts/package_studio.py dist/dont-wake-the-monster.rbxlx dist/StudioKit
          python3 scripts/verify_studio_geometry.py dist/StudioKit
          curl --fail --location --retry 3 https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o /tmp/lune.zip
          unzip -oq /tmp/lune.zip -d /tmp/lune
          chmod +x /tmp/lune/lune
          /tmp/lune/lune run scripts/test_orchard_place.luau dist/StudioKit/DontWakeTheMonster-Studio.rbxlx dist/entrance-layout.json dist/pond-camera.json dist/lamb-poses.json
          /tmp/lune/lune run scripts/test_rescue_round.luau dist/StudioKit/DontWakeTheMonster-Studio.rbxlx

      - name: Upload placed entrance mesh transforms for offline art review
        uses: actions/upload-artifact@v4
        with:
          name: entrance-layout
          path: |
            dist/entrance-layout.json
            dist/pond-camera.json
            dist/lamb-poses.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows Studio kit
        uses: actions/upload-artifact@v4
        with:
          name: windows-studio-kit
          path: dist/StudioKit.zip
          if-no-files-found: error
          retention-days: 14
