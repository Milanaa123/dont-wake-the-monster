name: Upload Roblox place (manual)

on:
  workflow_dispatch:
    inputs:
      place_id:
        description: Existing Roblox Place ID (not Universe ID)
        type: string
        required: true
      upload_mode:
        description: Saved = private draft; Published = publish to Roblox
        type: choice
        required: true
        default: Saved
        options:
          - Saved
          - Published

permissions:
  contents: read

concurrency:
  group: roblox-upload-${{ inputs.place_id }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate source and economy
        run: python3 scripts/validate_project.py

      - name: Install Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip' \
            -o /tmp/rojo.zip
          mkdir -p /tmp/rojo
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          /tmp/rojo/rojo --version

      - name: Verify Luau syntax
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/luau-lang/luau/releases/download/0.747/luau-ubuntu.zip' \
            -o /tmp/luau.zip
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          while IFS= read -r -d '' script; do
            /tmp/luau/luau-compile "$script" > /dev/null
          done < <(find src -name '*.luau' -print0)

      - name: Build place for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          /tmp/rojo/rojo build default.project.json --output dist/dont-wake-the-monster.rbxlx
          test -s dist/dont-wake-the-monster.rbxlx

      - name: Upload to existing Roblox place (never automatic)
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_PLACE_ID: ${{ inputs.place_id }}
          UPLOAD_MODE: ${{ inputs.upload_mode }}
        run: python3 scripts/publish_roblox.py
